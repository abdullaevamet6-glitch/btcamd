name: Update History

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Add current rate to history
        run: |
          # Читаем текущий курс
          CURRENT_RATE=$(jq -r '.rate' rate.json)

          # Читаем историю (если файла нет, создаём пустой массив)
          if [ -f history.json ]; then
            OLD_HISTORY=$(cat history.json)
          else
            OLD_HISTORY="[]"
          fi

          # Проверяем, есть ли уже такой курс в конце истории (чтобы не дублировать)
          LAST_VALUE=$(echo "$OLD_HISTORY" | jq 'last')
          if [ "$LAST_VALUE" != "$CURRENT_RATE" ]; then
            # Добавляем новый курс в историю и оставляем последние 50 значений
            NEW_HISTORY=$(echo "$OLD_HISTORY" | jq --argjson new "$CURRENT_RATE" '. + [$new] | last(50)')
            echo "$NEW_HISTORY" > history.json
            echo "История обновлена: добавлен курс $CURRENT_RATE"
          else
            echo "Курс не изменился, история не обновлена"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config.user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "auto update history" || echo "no changes"
          git push
