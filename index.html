<!DOCTYPE html>
<html>
<head>
    <title>BITAMD - курс крипты</title>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: black;
            color: white;
        }
        .rate {
            font-size: 64px;
            color: #f7931a;
            font-weight: bold;
            margin: 30px 0;
        }
        .update {
            color: gray;
        }
        button {
            background: #f7931a;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>💰 BITAMD / AMD</h1>
    <p>Симуляция криптовалюты</p>
    <div class="rate" id="rate">Загрузка...</div>
    <div class="update" id="update"></div>
    <button onclick="location.reload()">Обновить курс</button>

    <script>
        fetch('rate.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('rate').innerHTML = '1 BITAMD = ' + data.rate + ' AMD';
                document.getElementById('update').innerHTML = 'Обновлено: ' + new Date(data.last_updated * 1000).toLocaleString();
            })
            .catch(err => {
                document.getElementById('rate').innerHTML = 'Ошибка загрузки';
            });
    </script>
    <!-- ... твой существующий код сайта ... -->

<hr>

<h2>💰 Обменять AMD на BITAMD</h2>
<p>Заполни форму, и я обработаю заявку вручную:</p>

<form id="purchaseForm" action="https://formspree.io/f/xvzywwzk" method="POST">
    <label for="name">👤 Твоё имя:</label><br>
    <input type="text" id="name" name="name" required placeholder="Например: Алексей"><br><br>

    <label for="email">📧 Твоя почта:</label><br>
    <input type="email" id="email" name="email" required placeholder="Твоя почта для связи"><br><br>

    <label for="amount">💎 Количество BITAMD:</label><br>
    <input type="number" id="amount" name="amount" step="0.01" required placeholder="Сколько хочешь купить?"><br><br>

    <label for="message">💬 Дополнительно:</label><br>
    <textarea id="message" name="message" rows="2" placeholder="Твой ник в Telegram или другие детали"></textarea><br><br>

    <!-- Важно: эта строчка защитит тебя от спама! -->
    <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">

    <button type="submit">📩 Отправить заявку</button>
</form>

<!-- Сюда будет выводиться сообщение об успехе -->
<div id="formStatus" style="margin-top: 15px;"></div>

<script>
    // Этот скрипт перехватит отправку формы и отправит данные через fetch,
    // чтобы страница не перезагружалась.
    const form = document.getElementById('purchaseForm');
    const statusDiv = document.getElementById('formStatus');

    form.addEventListener('submit', async (e) => {
        e.preventDefault(); // Отменяем стандартную перезагрузку страницы

        statusDiv.innerHTML = '⏳ Отправляем заявку...';
        statusDiv.style.color = 'gray';

        const formData = new FormData(form);

        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: { 'Accept': 'application/json' }
            });

            if (response.ok) {
                statusDiv.innerHTML = '✅ Заявка отправлена! Я свяжусь с тобой в ближайшее время.';
                statusDiv.style.color = 'green';
                form.reset(); // Очищаем форму после успешной отправки
                setTimeout(() => statusDiv.innerHTML = '', 5000);
            } else {
                const errorData = await response.json();
                if (errorData.errors) {
                    statusDiv.innerHTML = `❌ Ошибка: ${errorData.errors.map(error => error.message).join(', ')}`;
                } else {
                    throw new Error('Ошибка при отправке');
                }
                statusDiv.style.color = 'red';
            }
        } catch (error) {
            statusDiv.innerHTML = '❌ Произошла сетевая ошибка. Попробуй ещё раз.';
            statusDiv.style.color = 'red';
        }
    });
    
</script>
</body>
</html>
