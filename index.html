<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITAMD - Криптовалюта</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #12121a 100%);
            color: #ffffff;
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Хедер */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #f7931a, #ffd166);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: #a0a0b0;
            font-size: 0.95rem;
        }

        /* Карточка курса */
        .rate-card {
            background: linear-gradient(135deg, rgba(247,147,26,0.15), rgba(255,180,70,0.05));
            backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 32px 24px;
            text-align: center;
            margin-bottom: 32px;
            border: 1px solid rgba(247,147,26,0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .rate-card .rate {
            font-size: 72px;
            font-weight: 800;
            color: #f7931a;
            text-shadow: 0 0 20px rgba(247,147,26,0.3);
            letter-spacing: -1px;
        }

        .rate-card .change {
            font-size: 24px;
            font-weight: 600;
            margin-top: 8px;
        }

        .rate-card .sub {
            font-size: 14px;
            color: #888;
            margin-top: 12px;
        }

        /* График */
        .chart-container {
            background: rgba(20,20,35,0.8);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 24px;
            margin-bottom: 32px;
            border: 1px solid rgba(247,147,26,0.2);
        }

        .chart-container h3 {
            margin-bottom: 20px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        canvas {
            max-height: 320px;
            width: 100%;
        }

        /* Сетка виджетов */
        .widgets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        /* Общие карточки */
        .widget-card {
            background: rgba(25,25,40,0.8);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 24px;
            border: 1px solid rgba(247,147,26,0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .widget-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.3);
            border-color: rgba(247,147,26,0.4);
        }

        .widget-card h3 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Кнопки и элементы форм */
        input, select {
            background: #1e1e2e;
            border: 1px solid #3a3a4e;
            color: white;
            padding: 12px 16px;
            border-radius: 28px;
            font-size: 1rem;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #f7931a;
            box-shadow: 0 0 0 2px rgba(247,147,26,0.2);
        }

        button {
            background: linear-gradient(135deg, #f7931a, #e07c00);
            border: none;
            padding: 12px 24px;
            border-radius: 32px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s;
            font-size: 0.9rem;
        }

        button:active {
            transform: scale(0.96);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Торговый блок (покупка/продажа) — КРАСИВЫЙ */
        .trade-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .trade-amount {
            background: rgba(0,0,0,0.3);
            border-radius: 48px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .trade-amount label {
            font-weight: 500;
            color: #ccc;
        }

        .trade-amount input {
            flex: 2;
            min-width: 120px;
        }

        .trade-buttons {
            display: flex;
            gap: 16px;
            justify-content: stretch;
        }

        .trade-buttons button {
            flex: 1;
            font-size: 1.1rem;
            padding: 14px;
            border-radius: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .btn-buy {
            background: linear-gradient(135deg, #2c7a4d, #1e5a3a);
            box-shadow: 0 4px 12px rgba(44,122,77,0.3);
        }

        .btn-buy:hover {
            background: linear-gradient(135deg, #3a9a60, #2c7a4d);
            transform: scale(1.02);
        }

        .btn-sell {
            background: linear-gradient(135deg, #c0392b, #a02020);
            box-shadow: 0 4px 12px rgba(192,57,43,0.3);
        }

        .btn-sell:hover {
            background: linear-gradient(135deg, #e04e3a, #c0392b);
            transform: scale(1.02);
        }

        .calc-value {
            background: rgba(247,147,26,0.15);
            border-radius: 28px;
            padding: 12px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border: 1px solid rgba(247,147,26,0.3);
        }

        .calc-value span {
            color: #f7931a;
            font-size: 1.5rem;
        }

        /* Результаты и сообщения */
        .result {
            margin-top: 16px;
            padding: 12px;
            border-radius: 28px;
            background: rgba(0,0,0,0.4);
            font-size: 0.85rem;
            text-align: center;
        }

        .win { color: #4caf50; background: rgba(76,175,80,0.1); }
        .lose { color: #f44336; background: rgba(244,67,54,0.1); }

        /* Промокоды */
        .promo-input {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        .promo-input input {
            flex: 2;
        }

        small {
            color: #888;
            font-size: 0.7rem;
        }

        /* Чат */
        .chat-frame {
            margin-top: 32px;
            border-radius: 32px;
            overflow: hidden;
            border: 1px solid rgba(247,147,26,0.2);
            background: rgba(0,0,0,0.2);
        }

        iframe {
            width: 100%;
            height: 400px;
            border: none;
            display: block;
        }

        hr {
            border-color: rgba(247,147,26,0.2);
            margin: 16px 0;
        }

        @media (max-width: 700px) {
            body { padding: 16px; }
            .rate-card .rate { font-size: 48px; }
            .widgets-grid { grid-template-columns: 1fr; }
            .trade-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ХЕДЕР -->
    <div class="header">
        <h1>⚡ BITAMD</h1>
        <p>Децентрализованная цифровая валюта нового поколения</p>
    </div>

    <!-- КАРТОЧКА КУРСА -->
    <div class="rate-card">
        <div class="rate" id="currentRate">0.00</div>
        <div class="change" id="currentChange">+0%</div>
        <div class="sub">1 BITAMD = AMD</div>
        <div class="sub" style="font-size: 12px;">Обновление курса: каждый час</div>
    </div>

    <!-- ГРАФИК -->
    <div class="chart-container">
        <h3>📈 ИСТОРИЯ КУРСА BITAMD</h3>
        <canvas id="rateChart" width="800" height="300"></canvas>
    </div>

    <!-- ВИДЖЕТЫ -->
    <div class="widgets-grid">
        <!-- СТАВКИ НА РОСТ/ПАДЕНИЕ -->
        <div class="widget-card">
            <h3>📊 ПРОГНОЗ КУРСА</h3>
            <p style="margin-bottom: 12px;">Курс через час будет:</p>
            <select id="betDirection" style="width: 100%; margin-bottom: 12px;">
                <option value="up">📈 ВЫШЕ (+10%)</option>
                <option value="down">📉 НИЖЕ (-10%)</option>
            </select>
            <input type="number" id="betAmount" placeholder="Сумма в BITAMD" value="10" style="width: 100%; margin-bottom: 12px;">
            <button id="makeBetBtn" style="width: 100%;">🚀 СДЕЛАТЬ СТАВКУ</button>
            <div id="betResult" class="result"></div>
        </div>

        <!-- ПРОМОКОДЫ -->
        <div class="widget-card">
            <h3>🎁 ПРОМОКОДЫ</h3>
            <div class="promo-input">
                <input type="text" id="promoCode" placeholder="Введи промокод">
                <button id="activatePromoBtn">АКТИВИРОВАТЬ</button>
            </div>
            <div id="promoResult" class="result"></div>
            <hr>
            
        </div>

        <!-- ПОКУПКА / ПРОДАЖА — КРАСИВО -->
        <div class="widget-card">
            <h3>💎 ТОРГОВЛЯ BITAMD</h3>
            <div class="trade-container">
                <div class="trade-amount">
                    <label>📦 Количество:</label>
                    <input type="number" id="tradeAmount" placeholder="Количество BITAMD" value="10" step="1">
                </div>
                <div class="calc-value">
                    💵 Стоимость: ≈ <span id="calcValue">0</span> AMD
                </div>
                <div class="trade-buttons">
                    <button id="buyBtn" class="btn-buy">💎 КУПИТЬ BITAMD</button>
                    <button id="sellBtn" class="btn-sell">💸 ПРОДАТЬ BITAMD</button>
                </div>
                <div id="tradeResult" class="result"></div>
            </div>
        </div>
    </div>

    <!-- ЧАТ -->
    <div class="chat-frame">
        <iframe src="https://tlk.io/embed/bitamd" title="BITAMD чат"></iframe>
    </div>
</div>

<script>
    // === НАСТРОЙКИ ===
    // ⚠️ СЮДА ВСТАВЬ СВОЙ URL ОТ НОВОГО СКРИПТА (Шаг 2)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyeYIJNf13ymT3aiX55EaY4HLYWxjg86VvOuopksiOFufXMkCyGJLE_i3OL04kHChV1/exec";
    
    let currentRate = 0;
    let rateChart = null;
    let lastBetTime = 0;
    let lastPromoTime = 0;
    let lastTradeTime = 0;

    // === ЗАГРУЗКА ТЕКУЩЕГО КУРСА ===
    async function loadCurrentRate() {
        try {
            const res = await fetch(`${SCRIPT_URL}?action=getCurrentRate`);
            const data = await res.json();
            if (data.success && data.rate) {
                currentRate = data.rate;
                document.getElementById('currentRate').innerText = currentRate.toFixed(2);
                updateCalculator();
            }
        } catch(e) {
            console.error("Ошибка загрузки курса:", e);
        }
    }

    // === ЗАГРУЗКА ГРАФИКА ===
    async function loadChart() {
        try {
            const res = await fetch(`${SCRIPT_URL}?action=getRateHistory`);
            const data = await res.json();
            if (data.success && data.history && data.history.length > 0) {
                const timestamps = data.history.map(h => {
                    const d = new Date(h.timestamp);
                    return `${d.toLocaleDateString()} ${d.toLocaleTimeString().slice(0,5)}`;
                });
                const rates = data.history.map(h => h.rate);
                
                const ctx = document.getElementById('rateChart').getContext('2d');
                if (rateChart) rateChart.destroy();
                rateChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: timestamps.slice(-24), // последние 24 точки
                        datasets: [{
                            label: 'BITAMD курс (AMD)',
                            data: rates.slice(-24),
                            borderColor: '#f7931a',
                            backgroundColor: 'rgba(247,147,26,0.05)',
                            borderWidth: 3,
                            pointRadius: 3,
                            pointBackgroundColor: '#f7931a',
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: { labels: { color: '#ccc' } },
                            tooltip: { mode: 'index', intersect: false }
                        },
                        scales: {
                            y: { grid: { color: '#2a2a3a' }, ticks: { color: '#ccc' } },
                            x: { grid: { display: false }, ticks: { color: '#aaa', maxRotation: 45, autoSkip: true } }
                        }
                    }
                });
            }
        } catch(e) {
            console.error("График не загрузился:", e);
        }
    }

    // === КАЛЬКУЛЯТОР ===
    function updateCalculator() {
        const amount = parseFloat(document.getElementById('tradeAmount').value) || 0;
        const calcSpan = document.getElementById('calcValue');
        if (calcSpan) calcSpan.innerText = (currentRate * amount).toFixed(2);
    }

    // === СТАВКИ ===
    async function makeBet() {
        const now = Date.now();
        if (now - lastBetTime < 60000) {
            document.getElementById('betResult').innerHTML = '⏳ Подожди 60 секунд между ставками';
            document.getElementById('betResult').className = 'result lose';
            return;
        }
        
        const direction = document.getElementById('betDirection').value;
        const amount = parseFloat(document.getElementById('betAmount').value);
        if (isNaN(amount) || amount <= 0) {
            document.getElementById('betResult').innerHTML = '❌ Введи корректную сумму';
            document.getElementById('betResult').className = 'result lose';
            return;
        }
        
        lastBetTime = now;
        document.getElementById('betResult').innerHTML = '⏳ Отправка заявки...';
        document.getElementById('betResult').className = 'result';
        
        // Здесь можно отправить заявку в Google Apps Script (если нужно)
        setTimeout(() => {
            const result = Math.random() > 0.5;
            if (result) {
                const winAmount = amount * 1.8;
                document.getElementById('betResult').innerHTML = `🎉 ВЫИГРЫШ! +${winAmount.toFixed(2)} BITAMD!`;
                document.getElementById('betResult').className = 'result win';
            } else {
                document.getElementById('betResult').innerHTML = `😞 ПРОИГРЫШ -${amount} BITAMD`;
                document.getElementById('betResult').className = 'result lose';
            }
        }, 1200);
    }

    // === ПРОМОКОДЫ ===
    const promoCodes = {
        "BITAMD2025": 10,
        "SALE50": 5,
        "WELCOME": 3,
        "FRIEND10": 2,
        "MOON100": 8,
        "SECRET99": 15
    };
    
    function activatePromo() {
        const now = Date.now();
        if (now - lastPromoTime < 30000) {
            document.getElementById('promoResult').innerHTML = '⏳ Подожди 30 секунд между промокодами';
            document.getElementById('promoResult').className = 'result lose';
            return;
        }
        
        const code = document.getElementById('promoCode').value.trim().toUpperCase();
        if (!promoCodes[code]) {
            document.getElementById('promoResult').innerHTML = '❌ Неверный промокод';
            document.getElementById('promoResult').className = 'result lose';
            return;
        }
        
        lastPromoTime = now;
        const reward = promoCodes[code];
        document.getElementById('promoResult').innerHTML = `🎁 Поздравляю! Ты получил ${reward} BITAMD!`;
        document.getElementById('promoResult').className = 'result win';
        document.getElementById('promoCode').value = '';
    }

    // === ПОКУПКА / ПРОДАЖА С КРАСИВЫМ СООБЩЕНИЕМ ===
    async function buy() {
        const now = Date.now();
        if (now - lastTradeTime < 10000) {
            document.getElementById('tradeResult').innerHTML = '⏳ Подожди 10 секунд между операциями';
            document.getElementById('tradeResult').className = 'result lose';
            return;
        }
        
        const amount = parseFloat(document.getElementById('tradeAmount').value);
        if (isNaN(amount) || amount <= 0) {
            document.getElementById('tradeResult').innerHTML = '❌ Введи корректное количество BITAMD';
            document.getElementById('tradeResult').className = 'result lose';
            return;
        }
        
        lastTradeTime = now;
        const totalAMD = (currentRate * amount).toFixed(2);
        document.getElementById('tradeResult').innerHTML = `⏳ Оформление заявки...`;
        document.getElementById('tradeResult').className = 'result';
        
        // Имитация отправки (можно заменить на реальный запрос к скрипту)
        setTimeout(() => {
            document.getElementById('tradeResult').innerHTML = `✅ Заявка на ПОКУПКУ ${amount} BITAMD (≈ ${totalAMD} AMD) отправлена! С вами свяжутся.`;
            document.getElementById('tradeResult').className = 'result win';
        }, 800);
    }
    
    async function sell() {
        const now = Date.now();
        if (now - lastTradeTime < 10000) {
            document.getElementById('tradeResult').innerHTML = '⏳ Подожди 10 секунд между операциями';
            document.getElementById('tradeResult').className = 'result lose';
            return;
        }
        
        const amount = parseFloat(document.getElementById('tradeAmount').value);
        if (isNaN(amount) || amount <= 0) {
            document.getElementById('tradeResult').innerHTML = '❌ Введи корректное количество BITAMD';
            document.getElementById('tradeResult').className = 'result lose';
            return;
        }
        
        lastTradeTime = now;
        const totalAMD = (currentRate * amount).toFixed(2);
        document.getElementById('tradeResult').innerHTML = `⏳ Оформление заявки...`;
        document.getElementById('tradeResult').className = 'result';
        
        setTimeout(() => {
            document.getElementById('tradeResult').innerHTML = `✅ Заявка на ПРОДАЖУ ${amount} BITAMD (≈ ${totalAMD} AMD) отправлена! С вами свяжутся.`;
            document.getElementById('tradeResult').className = 'result win';
        }, 800);
    }

    // === ОБРАБОТЧИКИ ===
    document.getElementById('makeBetBtn').onclick = makeBet;
    document.getElementById('activatePromoBtn').onclick = activatePromo;
    document.getElementById('buyBtn').onclick = buy;
    document.getElementById('sellBtn').onclick = sell;
    document.getElementById('tradeAmount').addEventListener('input', updateCalculator);

    // === ЗАПУСК ===
    loadCurrentRate();
    loadChart();
    setInterval(loadCurrentRate, 60000); // обновление курса каждую минуту
</script>
</body>
</html>
