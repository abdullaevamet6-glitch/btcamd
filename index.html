<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITAMD - курс крипты</title>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: black;
            color: white;
        }
        .rate {
            font-size: 64px;
            color: #f7931a;
            font-weight: bold;
            margin: 30px 0;
        }
        .update {
            color: gray;
        }
        button {
            background: #f7931a;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .form-container {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #1a1a1a;
            text-align: left;
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #555;
            background: #2a2a2a;
            color: white;
        }
        button[type="submit"] {
            width: 100%;
        }

        /* Адаптация для телефонов */
        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }
            .rate {
                font-size: 28px;
                white-space: nowrap;
                overflow-x: auto;
            }
            button {
                width: 100%;
                max-width: 300px;
            }
            .form-container {
                width: 90%;
                max-width: none;
            }
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <h1>💰 BITAMD / AMD</h1>
    <p>Симуляция криптовалюты</p>
    <div class="rate" id="rate">Загрузка...</div>
    <div class="update" id="update"></div>
    <button onclick="location.reload()">Обновить курс</button>

    <br><br>

    <!-- Кнопка покупки -->
    <button id="showBuyBtn" style="background: #f7931a; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer;">📩 Купить BITAMD</button>
    <!-- Кнопка продажи -->
    <button id="showSellBtn" style="background: #f7931a; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer;">🔄 Продать BITAMD</button>

    <!-- Форма покупки -->
    <div id="buyForm" class="form-container" style="display: none;">
        <h3>💰 Заявка на покупку BITAMD</h3>
        <form action="https://formspree.io/f/xvzywwzk" method="POST">
            <input type="hidden" name="type" value="purchase">
            <label>👤 Имя:</label><br>
            <input type="text" name="name" required placeholder="Твоё имя"><br><br>
            <label>📧 Почта:</label><br>
            <input type="email" name="email" required placeholder="Твоя почта"><br><br>
            <label>💎 Количество BITAMD:</label><br>
            <input type="number" name="amount" step="0.01" required placeholder="Сколько хочешь купить?"><br><br>
            <label>💬 Дополнительно:</label><br>
            <textarea name="message" rows="2" placeholder="Твой Telegram или другой контакт"></textarea><br><br>
            <input type="text" name="_gotcha" style="display:none">
            <button type="submit">📩 Отправить заявку</button>
        </form>
        <div id="buyStatus" style="margin-top: 10px;"></div>
    </div>

    <!-- Форма продажи -->
    <div id="sellForm" class="form-container" style="display: none;">
        <h3>💰 Заявка на продажу BITAMD</h3>
        <form action="https://formspree.io/f/xvzywwzk" method="POST">
            <input type="hidden" name="type" value="sale">
            <label>👤 Имя:</label><br>
            <input type="text" name="name" required placeholder="Твоё имя"><br><br>
            <label>📧 Почта:</label><br>
            <input type="email" name="email" required placeholder="Твоя почта"><br><br>
            <label>💎 Количество BITAMD:</label><br>
            <input type="number" name="amount" step="0.01" required placeholder="Сколько хочешь продать?"><br><br>
            <label>💬 Дополнительно:</label><br>
            <textarea name="message" rows="2" placeholder="Твой Telegram или другой контакт"></textarea><br><br>
            <input type="text" name="_gotcha" style="display:none">
            <button type="submit">🔄 Отправить заявку</button>
        </form>
        <div id="sellStatus" style="margin-top: 10px;"></div>
    </div>

    <script>
        // Загрузка курса
        fetch('rate.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('rate').innerHTML = '1 BITAMD = ' + parseFloat(data.rate).toFixed(2) + ' AMD';
                document.getElementById('update').innerHTML = 'Обновлено: ' + new Date(data.last_updated * 1000).toLocaleString();
            })
            .catch(err => {
                document.getElementById('rate').innerHTML = 'Ошибка загрузки';
            });

        // Логика для форм покупки и продажи
        const buyBtn = document.getElementById('showBuyBtn');
        const sellBtn = document.getElementById('showSellBtn');
        const buyFormDiv = document.getElementById('buyForm');
        const sellFormDiv = document.getElementById('sellForm');

        buyBtn.onclick = () => {
            buyFormDiv.style.display = 'block';
            sellFormDiv.style.display = 'none';
            buyBtn.textContent = '❌ Скрыть покупку';
            sellBtn.textContent = '🔄 Продать BITAMD';
        };

        sellBtn.onclick = () => {
            sellFormDiv.style.display = 'block';
            buyFormDiv.style.display = 'none';
            sellBtn.textContent = '❌ Скрыть продажу';
            buyBtn.textContent = '📩 Купить BITAMD';
        };

        // Функция отправки формы (общая)
        function setupForm(formId, statusId) {
            const form = document.querySelector(`#${formId} form`);
            const statusDiv = document.getElementById(statusId);
            if (!form) return;

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                statusDiv.innerHTML = '⏳ Отправляем...';
                statusDiv.style.color = 'gray';
                const formData = new FormData(form);
                try {
                    const response = await fetch(form.action, {
                        method: 'POST',
                        body: formData,
                        headers: { 'Accept': 'application/json' }
                    });
                    if (response.ok) {
                        statusDiv.innerHTML = '✅ Заявка отправлена!';
                        statusDiv.style.color = 'green';
                        form.reset();
                        setTimeout(() => {
                            statusDiv.innerHTML = '';
                            document.getElementById(formId).style.display = 'none';
                            if (formId === 'buyForm') {
                                buyBtn.textContent = '📩 Купить BITAMD';
                            } else {
                                sellBtn.textContent = '🔄 Продать BITAMD';
                            }
                        }, 2000);
                    } else {
                        throw new Error('Ошибка');
                    }
                } catch (error) {
                    statusDiv.innerHTML = '❌ Ошибка, попробуй ещё раз';
                    statusDiv.style.color = 'red';
                }
            });
        }

        setupForm('buyForm', 'buyStatus');
        setupForm('sellForm', 'sellStatus');
    </script>
</body>
</html>
