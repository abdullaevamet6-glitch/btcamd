<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITAMD - курс крипты</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: black; color: white; transition: background 0.3s, color 0.3s; }
        .rate { font-size: 48px; color: #f7931a; font-weight: bold; margin: 20px 0; }
        .update { color: gray; font-size: 12px; }
        button { background: #f7931a; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; font-weight: bold; }
        .form-container { margin-top: 20px; padding: 15px; border: 1px solid #333; border-radius: 10px; background: #1a1a1a; text-align: left; max-width: 300px; margin-left: auto; margin-right: auto; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #555; background: #2a2a2a; color: white; }
        button[type="submit"] { width: 100%; }
        canvas { max-width: 100%; margin: 20px auto; background: #0a0a0a; border-radius: 10px; padding: 10px; }
        .light { background: white; color: black; }
        .light .form-container { background: #f0f0f0; border-color: #ccc; }
        .light input, .light textarea { background: white; color: black; border-color: #ccc; }
        @media (max-width: 600px) { body { padding: 10px; } .rate { font-size: 32px; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

    <!-- Тикер (бегущая строка) -->
    <div style="position: fixed; top: 0; left: 0; right: 0; background: #0a0a0a; color: #f7931a; padding: 5px; overflow: hidden; white-space: nowrap; z-index: 1000;">
        <div id="ticker" style="display: inline-block; animation: scrollTicker 20s linear infinite;">
            📈 BITAMD: <span id="tickerRate">5.17</span> AMD | Изменение за час: <span id="tickerChange">0.00</span>%
        </div>
    </div>

    <!-- Таймер до обновления -->
    <div style="position: fixed; bottom: 10px; left: 10px; background: #1a1a1a; padding: 5px 10px; border-radius: 8px; font-size: 12px; color: white; z-index: 1000;">
        🕒 Следующее обновление: <span id="updateTimer">--:--</span>
    </div>

    <style>
        @keyframes scrollTicker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
    </style>

    <h1>💰 BITAMD / AMD</h1>
    <div class="rate" id="rate">Загрузка...</div>
    <div class="update" id="update"></div>
    <button onclick="location.reload()">🔄 Обновить курс</button>

    <h3>📈 График курса</h3>
    <canvas id="cryptoChart" width="400" height="200"></canvas>

    <div style="margin: 20px 0;">
        <button id="showBuyBtn">📩 Купить BITAMD</button>
        <button id="showSellBtn">🔄 Продать BITAMD</button>
    </div>

    <!-- Форма покупки -->
    <div id="buyForm" class="form-container" style="display: none;">
        <h3>💰 Заявка на покупку BITAMD</h3>
        <form id="buyFormElem" action="https://formspree.io/f/xvzywwzk" method="POST">
            <input type="hidden" name="type" value="purchase">
            <input type="text" name="name" placeholder="👤 Имя" required>
            <input type="email" name="email" placeholder="📧 Email" required>
            <input type="number" name="amount" step="0.01" placeholder="💎 Количество BITAMD" required>
            <textarea name="message" rows="2" placeholder="💬 Telegram или другой контакт"></textarea>
            <input type="text" name="_gotcha" style="display:none">
            <button type="submit">📩 Отправить заявку</button>
        </form>
        <div id="buyStatus"></div>
    </div>

    <!-- Форма продажи -->
    <div id="sellForm" class="form-container" style="display: none;">
        <h3>💰 Заявка на продажу BITAMD</h3>
        <form id="sellFormElem" action="https://formspree.io/f/xvzywwzk" method="POST">
            <input type="hidden" name="type" value="sale">
            <input type="text" name="name" placeholder="👤 Имя" required>
            <input type="email" name="email" placeholder="📧 Email" required>
            <input type="number" name="amount" step="0.01" placeholder="💎 Количество BITAMD" required>
            <textarea name="message" rows="2" placeholder="💬 Telegram или другой контакт"></textarea>
            <input type="text" name="_gotcha" style="display:none">
            <button type="submit">🔄 Отправить заявку</button>
        </form>
        <div id="sellStatus"></div>
    </div>

    <script>
        let chart = null;
        let lastRate = 5.17;

        function drawChart(history) {
            const ctx = document.getElementById('cryptoChart').getContext('2d');
            if (chart) chart.destroy();
            if (!history || history.length === 0) history = [5.17];
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: history.map((_, i) => i + 1),
                    datasets: [{
                        label: 'Курс BITAMD (AMD)',
                        data: history,
                        borderColor: '#f7931a',
                        backgroundColor: 'rgba(247, 147, 26, 0.05)',
                        borderWidth: 2.5,
                        pointRadius: 4,
                        fill: true,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { labels: { color: 'white' } } },
                    scales: { y: { ticks: { color: 'white' } }, x: { ticks: { color: 'white' } } }
                }
            });
        }

        function updateTicker(currentRate) {
            const change = ((currentRate - lastRate) / lastRate * 100).toFixed(2);
            document.getElementById('tickerRate').innerText = currentRate.toFixed(2);
            document.getElementById('tickerChange').innerHTML = (change >= 0 ? `+${change}` : change);
            lastRate = currentRate;
        }

        function updateTimer() {
            const now = new Date();
            const nextUpdate = new Date(now);
            nextUpdate.setMinutes(0, 0, 0);
            nextUpdate.setHours(nextUpdate.getHours() + 1);
            const diff = Math.floor((nextUpdate - now) / 1000);
            const minutes = Math.floor(diff / 60);
            const seconds = diff % 60;
            document.getElementById('updateTimer').innerText = `${minutes} мин ${seconds} сек`;
        }

        function refreshData() {
            fetch('rate.json?' + Date.now())
                .then(res => res.json())
                .then(data => {
                    document.getElementById('rate').innerHTML = '1 BITAMD = ' + data.rate.toFixed(2) + ' AMD';
                    document.getElementById('update').innerHTML = 'Обновлено: ' + new Date(data.last_updated * 1000).toLocaleString();
                    updateTicker(data.rate);
                    if (data.history && data.history.length) drawChart(data.history);
                    else drawChart([data.rate]);
                })
                .catch(err => console.error('Ошибка загрузки rate.json:', err));
        }

        // Управление кнопками
        const buyBtn = document.getElementById('showBuyBtn');
        const sellBtn = document.getElementById('showSellBtn');
        const buyFormDiv = document.getElementById('buyForm');
        const sellFormDiv = document.getElementById('sellForm');

        buyBtn.onclick = () => {
            buyFormDiv.style.display = 'block';
            sellFormDiv.style.display = 'none';
            buyBtn.textContent = '❌ Скрыть покупку';
            sellBtn.textContent = '🔄 Продать BITAMD';
        };

        sellBtn.onclick = () => {
            sellFormDiv.style.display = 'block';
            buyFormDiv.style.display = 'none';
            sellBtn.textContent = '❌ Скрыть продажу';
            buyBtn.textContent = '📩 Купить BITAMD';
        };

        // Отправка форм
        document.getElementById('buyFormElem').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('buyStatus');
            status.innerHTML = '⏳ Отправляем...';
            const fd = new FormData(e.target);
            try {
                const res = await fetch(e.target.action, { method: 'POST', body: fd, headers: { 'Accept': 'application/json' } });
                if (res.ok) {
                    status.innerHTML = '✅ Заявка отправлена!';
                    e.target.reset();
                    setTimeout(() => {
                        status.innerHTML = '';
                        buyFormDiv.style.display = 'none';
                        buyBtn.textContent = '📩 Купить BITAMD';
                    }, 2000);
                } else throw new Error();
            } catch {
                status.innerHTML = '❌ Ошибка';
            }
        });

        document.getElementById('sellFormElem').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('sellStatus');
            status.innerHTML = '⏳ Отправляем...';
            const fd = new FormData(e.target);
            try {
                const res = await fetch(e.target.action, { method: 'POST', body: fd, headers: { 'Accept': 'application/json' } });
                if (res.ok) {
                    status.innerHTML = '✅ Заявка отправлена!';
                    e.target.reset();
                    setTimeout(() => {
                        status.innerHTML = '';
                        sellFormDiv.style.display = 'none';
                        sellBtn.textContent = '🔄 Продать BITAMD';
                    }, 2000);
                } else throw new Error();
            } catch {
                status.innerHTML = '❌ Ошибка';
            }
        });

        refreshData();
        setInterval(refreshData, 60000);
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
