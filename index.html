<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITAMD - Криптовалюта</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui;
            background: linear-gradient(135deg, #0a0a0f, #12121a);
            color: #fff;
            padding: 24px;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 32px; }
        .header h1 { font-size: 3rem; background: linear-gradient(135deg, #f7931a, #ffd166); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .rate-card {
            background: rgba(247,147,26,0.1);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 32px;
            text-align: center;
            margin-bottom: 32px;
            border: 1px solid rgba(247,147,26,0.3);
        }
        .rate-card .rate { font-size: 72px; font-weight: 800; color: #f7931a; }
        .rate-card .change { font-size: 24px; margin-top: 8px; }
        .rate-card .last-update { font-size: 14px; margin-top: 12px; color: #aaa; }
        .chart-container {
            background: rgba(20,20,35,0.8);
            border-radius: 32px;
            padding: 24px;
            margin-bottom: 32px;
        }
        canvas { max-height: 320px; width: 100%; }
        .widgets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }
        .widget-card {
            background: rgba(25,25,40,0.8);
            border-radius: 32px;
            padding: 24px;
            border: 1px solid rgba(247,147,26,0.2);
        }
        .widget-card h3 { margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        input, select {
            background: #1e1e2e;
            border: 1px solid #3a3a4e;
            color: white;
            padding: 12px 16px;
            border-radius: 28px;
            width: 100%;
            margin-bottom: 12px;
        }
        button {
            background: linear-gradient(135deg, #f7931a, #e07c00);
            border: none;
            padding: 12px;
            border-radius: 32px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.96); }
        .btn-buy { background: linear-gradient(135deg, #2c7a4d, #1e5a3a); }
        .btn-sell { background: linear-gradient(135deg, #c0392b, #a02020); }
        .trade-buttons { display: flex; gap: 12px; margin-top: 8px; }
        .trade-buttons button { flex: 1; }
        .result {
            margin-top: 16px;
            padding: 12px;
            border-radius: 28px;
            background: rgba(0,0,0,0.4);
            text-align: center;
            font-size: 14px;
        }
        .win { color: #4caf50; background: rgba(76,175,80,0.1); }
        .lose { color: #f44336; background: rgba(244,67,54,0.1); }
        .promo-input { display: flex; gap: 12px; }
        .promo-input input { flex: 2; margin-bottom: 0; }
        .promo-input button { width: auto; }
        .chat-frame { margin-top: 32px; border-radius: 32px; overflow: hidden; border: 1px solid rgba(247,147,26,0.2); }
        iframe { width: 100%; height: 400px; border: none; }
        hr { border-color: rgba(247,147,26,0.2); margin: 16px 0; }
        small { color: #888; font-size: 12px; }
        @media (max-width: 700px) {
            .rate-card .rate { font-size: 48px; }
            .trade-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>⚡ BITAMD</h1>
        <p>Децентрализованная цифровая валюта</p>
    </div>

    <div class="rate-card">
        <div class="rate" id="currentRate">0.00</div>
        <div class="change" id="currentChange">+0%</div>
        <div class="last-update" id="lastUpdate">Загрузка...</div>
    </div>

    <div class="chart-container">
        <h3>📈 ИСТОРИЯ КУРСА BITAMD</h3>
        <canvas id="rateChart"></canvas>
    </div>

    <div class="widgets-grid">
        <!-- СТАВКИ -->
        <div class="widget-card">
            <h3>📊 ПРОГНОЗ КУРСА</h3>
            <input type="text" id="betName" placeholder="Твоё имя (обязательно)">
            <select id="betDirection">
                <option value="up">📈 ВЫШЕ (+10%)</option>
                <option value="down">📉 НИЖЕ (-10%)</option>
            </select>
            <input type="number" id="betAmount" placeholder="Сумма в BITAMD" value="10">
            <button id="makeBetBtn">🚀 СДЕЛАТЬ СТАВКУ</button>
            <div id="betResult" class="result"></div>
        </div>

        <!-- ПРОМОКОДЫ (скрытые, активация → письмо) -->
        <div class="widget-card">
            <h3>🎁 ПРОМОКОДЫ</h3>
            <div class="promo-input">
                <input type="text" id="promoCode" placeholder="Введи промокод">
                <button id="activatePromoBtn">АКТИВИРОВАТЬ</button>
            </div>
            <div id="promoResult" class="result"></div>
            <hr>
            <small style="color:#555;">* промокоды не публикуются</small>
        </div>

        <!-- ПОКУПКА / ПРОДАЖА -->
        <div class="widget-card">
            <h3>💎 ТОРГОВЛЯ BITAMD</h3>
            <input type="text" id="tradeName" placeholder="Твоё имя (обязательно)">
            <input type="number" id="tradeAmount" placeholder="Количество BITAMD" value="10">
            <div class="trade-buttons">
                <button id="buyBtn" class="btn-buy">💎 КУПИТЬ</button>
                <button id="sellBtn" class="btn-sell">💸 ПРОДАТЬ</button>
            </div>
            <div id="tradeResult" class="result"></div>
        </div>
    </div>

    <div class="chat-frame">
        <iframe src="https://tlk.io/embed/bitamd" title="BITAMD чат"></iframe>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwZk_qSJO0M6Ra_nb5cOR1VPwhoMUu5T48NALsE489Mx1bBuOS2-EPODdT9zrXuk7XX/exec";
    let currentRate = 0;
    let rateChart = null;
    let lastBetTime = 0, lastPromoTime = 0, lastTradeTime = 0;

        // Промокоды (список известен только серверу, но для активации они захардкожены)
    const promoCodes = {
        "BITAMD2025": 10,
        "SALE50": 5,
        "WELCOME": 3,
        "FRIEND10": 2,
        "MOON100": 8,
        "SECRET99": 15,
        "ENDOFSCHOOL": 15,
        "BESTSUMMER": 10,
        "SUMMER2026": 5,
        "SUMMER": 2
    };

    async function loadCurrentRate() {
        try {
            const res = await fetch(`${SCRIPT_URL}?action=getCurrentRate`);
            const data = await res.json();
            if (data.success && data.rate) {
                currentRate = data.rate;
                document.getElementById('currentRate').innerText = currentRate.toFixed(2);
            }
        } catch(e) { console.error(e); }
    }

    async function loadLastUpdate() {
        try {
            const res = await fetch(`${SCRIPT_URL}?action=getRateHistory`);
            const data = await res.json();
            if (data.success && data.history && data.history.length > 0) {
                const last = data.history[data.history.length - 1];
                const date = new Date(last.timestamp);
                document.getElementById('lastUpdate').innerHTML = `🕐 Последнее обновление: ${date.toLocaleString()}`;
            }
        } catch(e) { console.error(e); }
    }

    async function loadChart() {
        try {
            const res = await fetch(`${SCRIPT_URL}?action=getRateHistory`);
            const data = await res.json();
            if (data.success && data.history && data.history.length) {
                const timestamps = data.history.map(h => {
                    const d = new Date(h.timestamp);
                    return d.toLocaleTimeString().slice(0,5);
                });
                const rates = data.history.map(h => h.rate);
                const ctx = document.getElementById('rateChart').getContext('2d');
                if (rateChart) rateChart.destroy();
                rateChart = new Chart(ctx, {
                    type: 'line',
                    data: { labels: timestamps.slice(-24), datasets: [{ label: 'BITAMD курс', data: rates.slice(-24), borderColor: '#f7931a', borderWidth: 2, fill: true, backgroundColor: 'rgba(247,147,26,0.05)', tension: 0.3 }] },
                    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: '#ccc' } } }, scales: { y: { ticks: { color: '#ccc' } }, x: { ticks: { color: '#aaa' } } } }
                });
            }
        } catch(e) { console.error(e); }
    }

    async function makeBet() {
        const name = document.getElementById('betName').value.trim();
        if (!name) { showResult('betResult', '❌ Введи своё имя!', false); return; }
        if (Date.now() - lastBetTime < 30000) { showResult('betResult', '⏳ Подожди 30 секунд', false); return; }
        const amount = parseFloat(document.getElementById('betAmount').value);
        if (isNaN(amount) || amount <= 0) { showResult('betResult', '❌ Введи сумму', false); return; }
        const direction = document.getElementById('betDirection').value;
        lastBetTime = Date.now();
        showResult('betResult', '⏳ Отправка...', null);
        try {
            const res = await fetch(`${SCRIPT_URL}?action=bet&login=${encodeURIComponent(name)}&amount=${amount}&type=${direction}`);
            const data = await res.json();
            if (data.success) showResult('betResult', '✅ Ставка принята!', true);
            else throw new Error(data.error);
        } catch(e) { showResult('betResult', '❌ Ошибка отправки', false); }
    }

        async function activatePromo() {
        const name = prompt("Введите ваше имя (для уведомления администратора):");
        if (!name) {
            showResult('promoResult', '❌ Имя обязательно для активации промокода', false);
            return;
        }
        if (Date.now() - lastPromoTime < 30000) {
            showResult('promoResult', '⏳ Подожди 30 секунд', false);
            return;
        }
        
        const code = document.getElementById('promoCode').value.trim().toUpperCase();
        if (!promoCodes[code]) {
            showResult('promoResult', '❌ Неверный промокод', false);
            return;
        }
        
        // === НОВАЯ ПРОВЕРКА: использовал ли этот игрок этот промокод ===
        const storageKey = `promo_${name}_${code}`;
        if (localStorage.getItem(storageKey)) {
            showResult('promoResult', `❌ Игрок ${name} уже использовал промокод ${code}!`, false);
            return;
        }
        
        lastPromoTime = Date.now();
        const reward = promoCodes[code];
        
        // Сохраняем в localStorage факт использования
        localStorage.setItem(storageKey, new Date().toISOString());
        
        // Отправляем письмо администратору
        try {
            await fetch(`${SCRIPT_URL}?action=promo&login=${encodeURIComponent(name)}&promo=${code}&reward=${reward}`);
        } catch(e) { console.log("Ошибка отправки уведомления", e); }
        
        showResult('promoResult', `🎁 Поздравляем, ${name}! Вы получили ${reward} BITAMD!`, true);
        document.getElementById('promoCode').value = '';
    }
        
        // Отправляем письмо администратору
        try {
            await fetch(`${SCRIPT_URL}?action=promo&login=${encodeURIComponent(name)}&promo=${code}&reward=${reward}`);
        } catch(e) { console.log("Ошибка отправки уведомления", e); }
        
        showResult('promoResult', `🎁 Поздравляем, ${name}! Вы получили ${reward} BITAMD!`, true);
        document.getElementById('promoCode').value = '';
    }

    async function buy() {
        const name = document.getElementById('tradeName').value.trim();
        if (!name) { showResult('tradeResult', '❌ Введи своё имя!', false); return; }
        if (Date.now() - lastTradeTime < 10000) { showResult('tradeResult', '⏳ Подожди 10 секунд', false); return; }
        const amount = parseFloat(document.getElementById('tradeAmount').value);
        if (isNaN(amount) || amount <= 0) { showResult('tradeResult', '❌ Введи количество', false); return; }
        lastTradeTime = Date.now();
        showResult('tradeResult', '⏳ Оформление...', null);
        try {
            const res = await fetch(`${SCRIPT_URL}?action=buy&login=${encodeURIComponent(name)}&amount=${amount}&rate=${currentRate}`);
            const data = await res.json();
            if (data.success) showResult('tradeResult', `✅ Заявка на покупку ${amount} BITAMD отправлена.`, true);
            else throw new Error(data.error);
        } catch(e) { showResult('tradeResult', '❌ Ошибка', false); }
    }

    async function sell() {
        const name = document.getElementById('tradeName').value.trim();
        if (!name) { showResult('tradeResult', '❌ Введи своё имя!', false); return; }
        if (Date.now() - lastTradeTime < 10000) { showResult('tradeResult', '⏳ Подожди 10 секунд', false); return; }
        const amount = parseFloat(document.getElementById('tradeAmount').value);
        if (isNaN(amount) || amount <= 0) { showResult('tradeResult', '❌ Введи количество', false); return; }
        lastTradeTime = Date.now();
        showResult('tradeResult', '⏳ Оформление...', null);
        try {
            const res = await fetch(`${SCRIPT_URL}?action=sell&login=${encodeURIComponent(name)}&amount=${amount}&rate=${currentRate}`);
            const data = await res.json();
            if (data.success) showResult('tradeResult', `✅ Заявка на продажу ${amount} BITAMD отправлена.`, true);
            else throw new Error(data.error);
        } catch(e) { showResult('tradeResult', '❌ Ошибка', false); }
    }

    function showResult(elementId, message, isSuccess) {
        const el = document.getElementById(elementId);
        el.innerHTML = message;
        if (isSuccess === true) el.className = 'result win';
        else if (isSuccess === false) el.className = 'result lose';
        else el.className = 'result';
        setTimeout(() => { if (el) el.className = 'result'; }, 3000);
    }

    document.getElementById('makeBetBtn').onclick = makeBet;
    document.getElementById('activatePromoBtn').onclick = activatePromo;
    document.getElementById('buyBtn').onclick = buy;
    document.getElementById('sellBtn').onclick = sell;

    loadCurrentRate();
    loadLastUpdate();
    loadChart();
    setInterval(loadCurrentRate, 60000);
    setInterval(loadLastUpdate, 60000);
</script>
</body>
</html>
