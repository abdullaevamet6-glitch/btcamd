<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BITAMD - курс крипты</title>
    <style>
        * {
            transition: background-color 0.3s ease, color 0.2s ease, border-color 0.2s ease;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            background: black;
            color: white;
            margin: 0;
        }
        body.light {
            background: #f8f9fa;
            color: #212529;
        }
        body.light .card, body.light .form-container, body.light .bet-card, body.light .widget {
            background: white;
            border-color: #dee2e6;
        }
        body.light input, body.light textarea {
            background: #f8f9fa;
            border-color: #ced4da;
            color: #212529;
        }
        body.light button:not(.theme-btn) {
            background: #f7931a;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 15px;
        }
        .rate {
            font-size: 56px;
            font-weight: bold;
            color: #f7931a;
            margin: 15px 0;
            cursor: pointer;
            display: inline-block;
            padding: 0 20px;
            border-radius: 20px;
        }
        .rate:active {
            transform: scale(0.98);
        }
        .update {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 20px;
        }
        button, .btn {
            background: #f7931a;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: 0.2s;
        }
        button:hover {
            filter: brightness(0.9);
            transform: translateY(-1px);
        }
        .card, .form-container, .bet-card, .widget {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid #333;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #555;
            background: #2a2a2a;
            color: white;
        }
        canvas {
            max-width: 100%;
            margin: 20px auto;
            background: #0a0a0a;
            border-radius: 16px;
            padding: 10px;
        }
        .ticker {
            background: #0a0a0a;
            color: #f7931a;
            padding: 8px;
            overflow: hidden;
            white-space: nowrap;
            font-size: 14px;
            margin-bottom: 20px;
            border-radius: 8px;
            width: 100%;
        }
        .ticker span {
            display: inline-block;
            animation: scroll 20s linear infinite;
            padding-left: 100%;
        }
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
        .fixed-bottom {
            position: fixed;
            bottom: 15px;
            right: 15px;
            z-index: 100;
            display: flex;
            gap: 10px;
        }
        .theme-btn, .share-btn {
            background: #333;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            color: white;
        }
        .online-counter {
            background: #1a1a1a;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
        }
        body.light .online-counter {
            background: #e9ecef;
        }
        .timer-widget {
            background: #1a1a1a;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin: 10px auto;
            display: inline-block;
        }
        body.light .timer-widget {
            background: #e9ecef;
            color: #212529;
        }
        /* Кастомное всплывающее окно (toast) */
        .toast-message {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #f7931a;
            color: black;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            white-space: nowrap;
        }
        @media (max-width: 600px) {
            .rate { font-size: 36px; }
            .container { padding: 0 10px; }
            .toast-message { font-size: 12px; white-space: nowrap; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="ticker">
    <span>🚀 BITAMD: <span id="tickerRate">5.17</span> AMD | Изменение за час: <span id="tickerChange">0.00</span>%</span>
</div>

<div class="container">
    <div class="card" style="margin-top: 40px;">
        <h1>💰 BITAMD / AMD</h1>
        <div class="rate" id="rate">5.17</div>
        <div class="update" id="update"></div>
        <div class="timer-widget" id="timerWidget">🕒 До обновления курса: --:--</div>
        <button onclick="location.reload()">🔄 Обновить курс</button>
    </div>

    <div class="widget">
        <h3>📈 График курса</h3>
        <canvas id="cryptoChart" width="400" height="200"></canvas>
        <div>📊 Рост за сегодня: <span id="dailyChange">0.00</span>%</div>
    </div>

    <!-- Мини-игра: Сделай ставку -->
    <div class="bet-card">
        <h3>🎲 Сделай ставку на курс!</h3>
        <p>Предскажи, вырастет или упадёт BITAMD через час?</p>
        <form id="betForm">
            <input type="text" id="betName" placeholder="👤 Твоё имя" required>
            <select id="betDirection" style="width: 100%; padding: 10px; margin: 8px 0;">
                <option value="up">📈 Вырастет</option>
                <option value="down">📉 Упадёт</option>
            </select>
            <input type="number" id="betAmount" step="0.01" placeholder="💎 Ставка (BITAMD)" required>
            <button type="submit">🚀 Сделать ставку</button>
        </form>
        <div id="betStatus" style="margin-top: 10px; font-size: 14px;"></div>
    </div>

    <div style="margin: 20px 0;">
        <button id="showBuyBtn">📩 Купить BITAMD</button>
        <button id="showSellBtn">🔄 Продать BITAMD</button>
    </div>

    <!-- Форма покупки -->
    <div id="buyForm" class="form-container" style="display: none;">
        <h3>💰 Заявка на покупку BITAMD</h3>
        <form id="buyFormElem" action="https://formspree.io/f/xvzywwzk" method="POST">
            <input type="hidden" name="type" value="purchase">
            <input type="text" name="name" placeholder="👤 Имя" required>
            <input type="email" name="email" placeholder="📧 Email" required>
            <input type="number" name="amount" step="0.01" placeholder="💎 Количество BITAMD" required>
            <textarea name="message" rows="2" placeholder="💬 Telegram или другой контакт"></textarea>
            <input type="text" name="_gotcha" style="display:none">
            <button type="submit">📩 Отправить заявку</button>
        </form>
        <div id="buyStatus"></div>
    </div>

    <!-- Форма продажи -->
    <div id="sellForm" class="form-container" style="display: none;">
        <h3>💰 Заявка на продажу BITAMD</h3>
        <form id="sellFormElem" action="https://formspree.io/f/xvzywwzk" method="POST">
            <input type="hidden" name="type" value="sale">
            <input type="text" name="name" placeholder="👤 Имя" required>
            <input type="email" name="email" placeholder="📧 Email" required>
            <input type="number" name="amount" step="0.01" placeholder="💎 Количество BITAMD" required>
            <textarea name="message" rows="2" placeholder="💬 Telegram или другой контакт"></textarea>
            <input type="text" name="_gotcha" style="display:none">
            <button type="submit">🔄 Отправить заявку</button>
        </form>
        <div id="sellStatus"></div>
    </div>
</div>

<div class="fixed-bottom">
    <div class="online-counter">👥 <span id="onlineCount">3</span> онлайн</div>
    <div class="share-btn" id="shareBtn">🔗</div>
    <div class="theme-btn" id="themeToggle">🌓</div>
</div>

<div id="toastMessage" class="toast-message"></div>

<script>
    // --- ID формы для ставок ---
    const BET_FORM_URL = "https://formspree.io/f/xjgzlylz";

    let chart = null;
    let lastRate = 5.17;
    let clickCount = 0;
    let coinSound = null;

    function showToast(message) {
        const toast = document.getElementById('toastMessage');
        toast.innerText = message;
        toast.style.opacity = '1';
        setTimeout(() => { toast.style.opacity = '0'; }, 2000);
    }

    function playCoin() {
        if (!coinSound) {
            coinSound = new Audio('https://www.soundjay.com/misc/sounds/coin-drop-2.mp3');
            coinSound.volume = 0.2;
        }
        coinSound.currentTime = 0;
        coinSound.play().catch(e => console.log("Звук заблокирован"));
    }

    document.getElementById('rate').addEventListener('click', () => {
        clickCount++;
        playCoin();
        if (clickCount === 5) {
            showToast('🎉 Вы нашли секрет! BITAMD — лучшая крипта! 🚀');
            clickCount = 0;
        }
    });

    function drawChart(history) {
        const ctx = document.getElementById('cryptoChart').getContext('2d');
        if (chart) chart.destroy();
        if (!history || history.length === 0) history = [5.17];
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: history.map((_, i) => i + 1),
                datasets: [{
                    label: 'Курс BITAMD (AMD)',
                    data: history,
                    borderColor: '#f7931a',
                    backgroundColor: 'rgba(247, 147, 26, 0.05)',
                    borderWidth: 2.5,
                    pointRadius: 4,
                    fill: true,
                    tension: 0.2
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { labels: { color: document.body.classList.contains('light') ? 'black' : 'white' } } },
                scales: { y: { ticks: { color: document.body.classList.contains('light') ? 'black' : 'white' } }, x: { ticks: { color: document.body.classList.contains('light') ? 'black' : 'white' } } }
            }
        });
    }

    function updateTimerDisplay() {
        const now = new Date();
        const nextUpdate = new Date(now);
        nextUpdate.setMinutes(0, 0, 0);
        nextUpdate.setHours(nextUpdate.getHours() + 1);
        const diffMs = nextUpdate - now;
        const minutes = Math.floor(diffMs / 60000);
        const seconds = Math.floor((diffMs % 60000) / 1000);
        document.getElementById('timerWidget').innerHTML = `🕒 До обновления курса: ${minutes} мин ${seconds} сек`;
    }
    setInterval(updateTimerDisplay, 1000);
    updateTimerDisplay();

    function updateTicker(currentRate) {
        const change = ((currentRate - lastRate) / lastRate * 100).toFixed(2);
        document.getElementById('tickerRate').innerText = currentRate.toFixed(2);
        document.getElementById('tickerChange').innerHTML = (change >= 0 ? `+${change}` : change);
        lastRate = currentRate;
    }

    function refreshData() {
        fetch('rate.json?' + Date.now())
            .then(res => res.json())
            .then(data => {
                document.getElementById('rate').innerHTML = '1 BITAMD = ' + data.rate.toFixed(2) + ' AMD';
                document.getElementById('update').innerHTML = 'Обновлено: ' + new Date(data.last_updated * 1000).toLocaleString();
                updateTicker(data.rate);
                if (data.history && data.history.length) {
                    drawChart(data.history);
                    const firstRate = data.history[0];
                    const dailyChange = ((data.rate - firstRate) / firstRate * 100).toFixed(2);
                    document.getElementById('dailyChange').innerHTML = (dailyChange >= 0 ? `+${dailyChange}` : dailyChange);
                } else {
                    drawChart([data.rate]);
                }
            })
            .catch(err => console.error('Ошибка загрузки rate.json:', err));
    }

    // Динамический онлайн-счётчик (иллюзия реальных людей)
    let onlineCount = 3;
    setInterval(() => {
        let delta = Math.floor(Math.random() * 5) - 2; // -2..2
        onlineCount += delta;
        if (onlineCount < 1) onlineCount = 1;
        if (onlineCount > 12) onlineCount = 12;
        document.getElementById('onlineCount').innerText = onlineCount;
    }, 15000);

    document.getElementById('shareBtn').onclick = () => {
        navigator.clipboard.writeText(window.location.href);
        showToast('✅ Ссылка на сайт скопирована!');
        playCoin();
    };

    function setTheme(theme) {
        if (theme === 'light') {
            document.body.classList.add('light');
            localStorage.setItem('bitamd_theme', 'light');
        } else {
            document.body.classList.remove('light');
            localStorage.setItem('bitamd_theme', 'dark');
        }
        fetch('rate.json?' + Date.now())
            .then(res => res.json())
            .then(data => { if (data.history) drawChart(data.history); });
    }
    const savedTheme = localStorage.getItem('bitamd_theme');
    if (savedTheme === 'light') setTheme('light');
    document.getElementById('themeToggle').onclick = () => {
        if (document.body.classList.contains('light')) setTheme('dark');
        else setTheme('light');
        playCoin();
    };

    const betForm = document.getElementById('betForm');
    const betStatus = document.getElementById('betStatus');
    betForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('betName').value.trim();
        const direction = document.getElementById('betDirection').value;
        const amount = parseFloat(document.getElementById('betAmount').value);
        if (!name || isNaN(amount) || amount <= 0) {
            betStatus.innerHTML = '❌ Введите корректное имя и сумму ставки!';
            return;
        }
        betStatus.innerHTML = '⏳ Отправка ставки...';
        const formData = new FormData();
        formData.append('type', 'bet');
        formData.append('name', name);
        formData.append('direction', direction === 'up' ? 'Вырастет' : 'Упадёт');
        formData.append('amount', amount);
        formData.append('timestamp', new Date().toLocaleString());
        try {
            const response = await fetch(BET_FORM_URL, { method: 'POST', body: formData, headers: { 'Accept': 'application/json' } });
            if (response.ok) {
                betStatus.innerHTML = `✅ Ставка принята, ${name}! Вы предсказали, что курс ${direction === 'up' ? 'вырастет 📈' : 'упадёт 📉'} на ${amount} BITAMD. Результат узнаете через час.`;
                betForm.reset();
                playCoin();
            } else throw new Error();
        } catch (error) {
            betStatus.innerHTML = '❌ Ошибка отправки ставки. Попробуйте позже.';
        }
    });

    const buyBtn = document.getElementById('showBuyBtn');
    const sellBtn = document.getElementById('showSellBtn');
    const buyFormDiv = document.getElementById('buyForm');
    const sellFormDiv = document.getElementById('sellForm');

    buyBtn.onclick = () => {
        buyFormDiv.style.display = 'block';
        sellFormDiv.style.display = 'none';
        buyBtn.textContent = '❌ Скрыть покупку';
        sellBtn.textContent = '🔄 Продать BITAMD';
        playCoin();
    };
    sellBtn.onclick = () => {
        sellFormDiv.style.display = 'block';
        buyFormDiv.style.display = 'none';
        sellBtn.textContent = '❌ Скрыть продажу';
        buyBtn.textContent = '📩 Купить BITAMD';
        playCoin();
    };

    document.getElementById('buyFormElem').addEventListener('submit', async (e) => {
        e.preventDefault();
        const status = document.getElementById('buyStatus');
        status.innerHTML = '⏳ Отправляем...';
        const fd = new FormData(e.target);
        try {
            const res = await fetch(e.target.action, { method: 'POST', body: fd, headers: { 'Accept': 'application/json' } });
            if (res.ok) {
                status.innerHTML = '✅ Заявка отправлена!';
                e.target.reset();
                setTimeout(() => {
                    status.innerHTML = '';
                    buyFormDiv.style.display = 'none';
                    buyBtn.textContent = '📩 Купить BITAMD';
                    playCoin();
                }, 2000);
            } else throw new Error();
        } catch {
            status.innerHTML = '❌ Ошибка';
        }
    });

    document.getElementById('sellFormElem').addEventListener('submit', async (e) => {
        e.preventDefault();
        const status = document.getElementById('sellStatus');
        status.innerHTML = '⏳ Отправляем...';
        const fd = new FormData(e.target);
        try {
            const res = await fetch(e.target.action, { method: 'POST', body: fd, headers: { 'Accept': 'application/json' } });
            if (res.ok) {
                status.innerHTML = '✅ Заявка отправлена!';
                e.target.reset();
                setTimeout(() => {
                    status.innerHTML = '';
                    sellFormDiv.style.display = 'none';
                    sellBtn.textContent = '🔄 Продать BITAMD';
                    playCoin();
                }, 2000);
            } else throw new Error();
        } catch {
            status.innerHTML = '❌ Ошибка';
        }
    });

    refreshData();
    setInterval(refreshData, 60000);
</script>
</body>
</html>
