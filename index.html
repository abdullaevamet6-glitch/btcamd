<!DOCTYPE html>
<html>
<head>
    <title>BITAMD - курс крипты</title>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: black;
            color: white;
        }
        .rate {
            font-size: 64px;
            color: #f7931a;
            font-weight: bold;
            margin: 30px 0;
        }
        .update {
            color: gray;
        }
        button {
            background: #f7931a;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>💰 BITAMD / AMD</h1>
    <p>Симуляция криптовалюты</p>
    <div class="rate" id="rate">Загрузка...</div>
    <div class="update" id="update"></div>
    <button onclick="location.reload()">Обновить курс</button>

    <script>
        fetch('rate.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('rate').innerHTML = '1 BITAMD = ' + data.rate + ' AMD';
                document.getElementById('update').innerHTML = 'Обновлено: ' + new Date(data.last_updated * 1000).toLocaleString();
            })
            .catch(err => {
                document.getElementById('rate').innerHTML = 'Ошибка загрузки';
            });
    </script>
    <!-- ... твой существующий код сайта ... -->

<hr>

<h2>💰 Обменять AMD на BITAMD</h2>
<p>Заполни форму, и я обработаю заявку вручную:</p>

<form id="purchaseForm" action="https://formspree.io/f/xvzywwzk" method="POST">
    <label for="name">👤 Твоё имя:</label><br>
    <input type="text" id="name" name="name" required placeholder="Например: Алексей"><br><br>

    <label for="email">📧 Твоя почта:</label><br>
    <input type="email" id="email" name="email" required placeholder="Твоя почта для связи"><br><br>

    <label for="amount">💎 Количество BITAMD:</label><br>
    <input type="number" id="amount" name="amount" step="0.01" required placeholder="Сколько хочешь купить?"><br><br>

    <label for="message">💬 Дополнительно:</label><br>
    <textarea id="message" name="message" rows="2" placeholder="Твой ник в Telegram или другие детали"></textarea><br><br>

    <!-- Важно: эта строчка защитит тебя от спама! -->
    <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">

    <button type="submit">📩 Отправить заявку</button>
</form>

<!-- Сюда будет выводиться сообщение об успехе -->
<div id="formStatus" style="margin-top: 15px;"></div>

<script>
    // Этот скрипт перехватит отправку формы и отправит данные через fetch,
    // чтобы страница не перезагружалась.
    const form = document.getElementById('purchaseForm');
    const statusDiv = document.getElementById('formStatus');

    form.addEventListener('submit', async (e) => {
        e.preventDefault(); // Отменяем стандартную перезагрузку страницы

        statusDiv.innerHTML = '⏳ Отправляем заявку...';
        statusDiv.style.color = 'gray';

        const formData = new FormData(form);

        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: { 'Accept': 'application/json' }
            });

            if (response.ok) {
                statusDiv.innerHTML = '✅ Заявка отправлена! Я свяжусь с тобой в ближайшее время.';
                statusDiv.style.color = 'green';
                form.reset(); // Очищаем форму после успешной отправки
                setTimeout(() => statusDiv.innerHTML = '', 5000);
            } else {
                const errorData = await response.json();
                if (errorData.errors) {
                    statusDiv.innerHTML = `❌ Ошибка: ${errorData.errors.map(error => error.message).join(', ')}`;
                } else {
                    throw new Error('Ошибка при отправке');
                }
                statusDiv.style.color = 'red';
            }
        } catch (error) {
            statusDiv.innerHTML = '❌ Произошла сетевая ошибка. Попробуй ещё раз.';
            statusDiv.style.color = 'red';
        }
    });
    
</script>
    <!-- ========= НОВЫЙ КОД С КНОПКОЙ И ФОРМОЙ ========= -->
    <button id="showFormBtn" style="background: #f7931a; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer;">📩 Заказать BITAMD</button>

    <div id="orderForm" style="display: none; margin-top: 20px; padding: 15px; border: 1px solid #333; border-radius: 10px;">
        <h3>💰 Заявка на BITAMD</h3>
        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
            <label>👤 Имя:</label><br>
            <input type="text" name="name" required placeholder="Твоё имя"><br><br>
            <label>📧 Почта:</label><br>
            <input type="email" name="email" required placeholder="Твоя почта"><br><br>
            <label>💎 Количество BITAMD:</label><br>
            <input type="number" name="amount" step="0.01" required placeholder="Сколько хочешь купить?"><br><br>
            <label>💬 Дополнительно:</label><br>
            <textarea name="message" rows="2" placeholder="Твой Telegram или другой контакт"></textarea><br><br>
            <input type="text" name="_gotcha" style="display:none">
            <button type="submit" style="background: #f7931a; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer;">📩 Отправить заявку</button>
        </form>
        <div id="formStatus" style="margin-top: 10px;"></div>
    </div>

    <script>
        // Управление кнопкой
        const showBtn = document.getElementById('showFormBtn');
        const orderFormDiv = document.getElementById('orderForm');

        showBtn.onclick = function() {
            if (orderFormDiv.style.display === 'none') {
                orderFormDiv.style.display = 'block';
                showBtn.textContent = '❌ Скрыть заказ';
            } else {
                orderFormDiv.style.display = 'none';
                showBtn.textContent = '📩 Заказать BITAMD';
            }
        }

        // Отправка формы
        const hiddenForm = document.querySelector('#orderForm form');
        const statusDiv = document.getElementById('formStatus');

        if (hiddenForm) {
            hiddenForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                statusDiv.innerHTML = '⏳ Отправляем...';
                statusDiv.style.color = 'gray';
                const formData = new FormData(hiddenForm);
                try {
                    const response = await fetch(hiddenForm.action, {
                        method: 'POST',
                        body: formData,
                        headers: { 'Accept': 'application/json' }
                    });
                    if (response.ok) {
                        statusDiv.innerHTML = '✅ Заявка отправлена!';
                        statusDiv.style.color = 'green';
                        hiddenForm.reset();
                        setTimeout(() => {
                            statusDiv.innerHTML = '';
                            orderFormDiv.style.display = 'none';
                            showBtn.textContent = '📩 Заказать BITAMD';
                        }, 2000);
                    } else {
                        throw new Error('Ошибка');
                    }
                } catch (error) {
                    statusDiv.innerHTML = '❌ Ошибка, попробуй ещё раз';
                    statusDiv.style.color = 'red';
                }
            });
        }
    </script>
    <!-- ========= КОНЕЦ НОВОГО КОДА ========= -->
    
</body>
</html>
