name: BITAMD Advanced

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install jq and bc
        run: sudo apt-get update && sudo apt-get install -y jq bc

      - name: Update rate
        run: |
          # Читаем текущий курс и историю
          OLD_RATE=$(jq -r '.rate' rate.json)
          OLD_HISTORY=$(cat history.json)

          # Генерируем новый курс
          TREND=$((RANDOM % 21 - 10))
          NEW_RATE=$(echo "$OLD_RATE + $OLD_RATE * $TREND / 100" | bc -l)
          NEW_RATE=$(printf "%.2f" $NEW_RATE)
          if (( $(echo "$NEW_RATE < 0.30" | bc -l) )); then
            NEW_RATE="0.30"
          fi

          TS=$(date +%s)

          # Добавляем новый курс в историю и оставляем последние 30 значений
          NEW_HISTORY=$(echo "$OLD_HISTORY" | jq --argjson new "$NEW_RATE" '. + [$new] | last(30)')

          # Сохраняем оба файла
          echo "{\"rate\": $NEW_RATE, \"last_updated\": $TS}" > rate.json
          echo "$NEW_HISTORY" > history.json

          echo "Курс обновлен: $OLD_RATE -> $NEW_RATE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config.user.email "github-actions[bot]@users.noreply.github.com"
          git add rate.json history.json
          git commit -m "auto update" || echo "no changes"
          git push
