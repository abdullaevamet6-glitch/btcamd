name: BITAMD Advanced

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install jq and bc
        run: sudo apt-get update && sudo apt-get install -y jq bc

      - name: Update rate and history
        run: |
          # Текущий курс
          OLD_RATE=$(jq -r '.rate' rate.json)
          echo "Старый курс: $OLD_RATE"

          # Генерируем новый курс
          TREND=$((RANDOM % 21 - 10))
          NEW_RATE=$(echo "$OLD_RATE + $OLD_RATE * $TREND / 100" | bc -l)
          NEW_RATE=$(printf "%.2f" $NEW_RATE)
          if (( $(echo "$NEW_RATE < 0.30" | bc -l) )); then
            NEW_RATE="0.30"
          fi
          echo "Новый курс: $NEW_RATE"

          TS=$(date +%s)

          # Сохраняем новый курс в rate.json
          echo "{\"rate\": $NEW_RATE, \"last_updated\": $TS}" > rate.json

          # --- Обновляем историю ---
          if [ -f history.json ]; then
            OLD_HISTORY=$(cat history.json)
          else
            OLD_HISTORY="[]"
          fi

          # Проверяем, не добавлен ли уже этот курс
          LAST_VALUE=$(echo "$OLD_HISTORY" | jq 'last')
          if [ "$LAST_VALUE" != "$NEW_RATE" ]; then
            NEW_HISTORY=$(echo "$OLD_HISTORY" | jq --argjson new "$NEW_RATE" '. + [$new] | last(30)')
            echo "$NEW_HISTORY" > history.json
            echo "История обновлена: добавлен $NEW_RATE"
          else
            echo "Курс не изменился, история не обновлена"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config.user.email "github-actions[bot]@users.noreply.github.com"
          git add rate.json history.json
          git commit -m "auto update" || echo "no changes"
          git push
