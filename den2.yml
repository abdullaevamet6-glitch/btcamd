name: BITAMD Advanced

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install bc
        run: sudo apt-get update && sudo apt-get install -y bc

      - name: Update rate
        run: |
          OLD=$(jq -r '.rate' rate.json)
          TREND=$((RANDOM % 21 - 10))
          NEW=$(echo "$OLD + $OLD * $TREND / 100" | bc -l)
          NEW=$(printf "%.2f" $NEW)
          if (( $(echo "$NEW < 0.30" | bc -l) )); then
            NEW="0.30"
          fi
          TS=$(date +%s)
          echo "{\"rate\": $NEW, \"last_updated\": $TS}" > rate.json
          echo "Курс обновлен: $OLD -> $NEW"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config.user.email "github-actions[bot]@users.noreply.github.com"
          git add rate.json
          git commit -m "auto update" || echo "no changes"
          git push
