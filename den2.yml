name: BITAMD Advanced

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install jq and bc
        run: sudo apt-get update && sudo apt-get install -y jq bc

      - name: Update rate
        run: |
          # Читаем старые данные
          OLD_RATE=$(jq -r '.rate' rate.json)
          OLD_HISTORY=$(jq -r '.history // []' rate.json)

          # Генерируем новый курс
          TREND=$((RANDOM % 21 - 10))
          NEW_RATE=$(echo "$OLD_RATE + $OLD_RATE * $TREND / 100" | bc -l)
          NEW_RATE=$(printf "%.2f" $NEW_RATE)
          if (( $(echo "$NEW_RATE < 0.30" | bc -l) )); then
            NEW_RATE="0.30"
          fi

          TS=$(date +%s)

          # Добавляем новый курс в историю (если он изменился)
          if [ "$OLD_HISTORY" = "[]" ]; then
            NEW_HISTORY="[$NEW_RATE]"
          else
            # Проверяем, не дублируется ли последнее значение
            LAST=$(echo "$OLD_HISTORY" | jq 'last')
            if [ "$LAST" != "$NEW_RATE" ]; then
              NEW_HISTORY=$(echo "$OLD_HISTORY" | jq --argjson new "$NEW_RATE" '. + [$new] | last(30)')
            else
              NEW_HISTORY=$OLD_HISTORY
            fi
          fi

          # Сохраняем в rate.json (с историей!)
          jq --argjson rate "$NEW_RATE" \
             --argjson ts "$TS" \
             --argjson history "$NEW_HISTORY" \
             '.rate = $rate | .last_updated = $ts | .history = $history' \
             rate.json > tmp.json
          mv tmp.json rate.json

          echo "Курс обновлен: $OLD_RATE -> $NEW_RATE"
          echo "История: $NEW_HISTORY"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config.user.email "github-actions[bot]@users.noreply.github.com"
          git add rate.json
          git commit -m "auto update" || echo "no changes"
          git push
