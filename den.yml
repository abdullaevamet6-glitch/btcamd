name: Hourly Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update rate
        run: |
          if [ -f rate.json ]; then
            OLD=$(cat rate.json | jq -r '.rate')
          else
            OLD=5.00
          fi
          CHANGE=$((RANDOM % 9 - 4))
          CHANGE=$(echo "scale=2; $CHANGE / 2" | bc -l)
          NEW=$(echo "$OLD + $OLD * $CHANGE / 100" | bc -l)
          NEW=$(printf "%.2f" $NEW)
          if (( $(echo "$NEW < 0.50" | bc -l) )); then
            NEW=0.50
          fi
          TS=$(date +%s)
          echo "{\"rate\": $NEW, \"last_updated\": $TS}" > rate.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rate.json
          git commit -m "auto update" || echo "no changes"
          git push
