name: Обновление курса BITAMD

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Установить jq и bc
        run: sudo apt-get update && sudo apt-get install -y jq bc
      
      - name: Создать или обновить курс
        id: rate
        run: |
          if [ -f rate.json ]; then
            OLD_RATE=$(cat rate.json | jq -r '.rate')
          else
            OLD_RATE="5.00"
          fi
          
          CHANGE=$((RANDOM % 21 - 10))
          NEW_RATE=$(echo "$OLD_RATE + $OLD_RATE * $CHANGE / 100" | bc -l)
          NEW_RATE=$(printf "%.2f" $NEW_RATE)
          
          if (( $(echo "$NEW_RATE < 0.50" | bc -l) )); then
            NEW_RATE="0.50"
          fi
          
          echo "{\"rate\": $NEW_RATE, \"last_updated\": $(date +%s), \"history\": []}" > rate.json
          echo "rate=$NEW_RATE" >> $GITHUB_OUTPUT
          
          echo "Курс обновлен: $OLD_RATE -> $NEW_RATE"
      
      - name: Вызвать Google Apps Script (запись в таблицу)
        run: |
          curl -L "https://script.google.com/macros/s/AKfycbxT0iH9_KZuzfQmLc2JYK-8tNqLvJWBkZ3ZVi32TT_j15I77R1fYQHoYv0Hla-vc0l9/exec?action=addRateHistory&rate=${{ steps.rate.outputs.rate }}"
      
      - name: Отправить изменения в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rate.json
          git commit -m "Автообновление курса BITAMD: ${{ steps.rate.outputs.rate }}" || echo "Нет изменений"
          git push
