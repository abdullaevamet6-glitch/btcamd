name: Обновление BITAMD каждый час

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Обновить курс
        run: |
          if [ -f rate.json ]; then
            OLD=$(cat rate.json | jq -r '.rate')
          else
            OLD="5.00"
          fi

          # Случайное изменение: -2% .. +2% (шаг 0.5%)
          CHANGE=$((RANDOM % 9 - 4))
          CHANGE=$(echo "scale=2; $CHANGE / 2" | bc -l)
          NEW=$(echo "$OLD + $OLD * $CHANGE / 100" | bc -l)
          NEW=$(printf "%.2f" $NEW)

          # Защита от дна
          if (( $(echo "$NEW < 0.50" | bc -l) )); then
            NEW="0.50"
          fi

          TIMESTAMP=$(date +%s)
          echo "{\"rate\": $NEW, \"last_updated\": $TIMESTAMP}" > rate.json

          echo "Курс обновлен: $OLD -> $NEW"

      - name: Отправить изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rate.json
          git commit -m "Автообновление курса BITAMD" || echo "Нет изменений"
          git push
