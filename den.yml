name: Обновление курса BITAMD

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Установить Python и requests
        run: sudo apt-get install -y python3 python3-requests
      
      - name: Обновить курс и отправить в Google Sheets
        run: |
          python3 -c "
import json, random, time, requests

# 1. Читаем старый курс
try:
    with open('rate.json', 'r') as f:
        old_rate = json.load(f).get('rate', 5.00)
except:
    old_rate = 5.00

# 2. Генерируем новый курс
change_pct = random.uniform(-0.10, 0.10)
new_rate = round(old_rate * (1 + change_pct), 2)
if new_rate < 0.50: new_rate = 0.50

# 3. Сохраняем rate.json в репозитории
with open('rate.json', 'w') as f:
    json.dump({'rate': new_rate, 'last_updated': int(time.time()), 'history': []}, f, indent=2)

print(f'Курс: {old_rate} -> {new_rate}')

# 4. Отправляем в Google Таблицу
url = 'https://script.google.com/macros/s/AKfycbx4zknAhUSNj9TbueuLPcwyx_z1S5slY7ULG9clvcGURITbrJYwDB2PykIbXKbssNtm/exec'
resp = requests.get(url, params={'action': 'addRateHistory', 'rate': new_rate}, timeout=10)
print(f'Ответ Google: {resp.text}')
"
      
      - name: Сохранить изменения в репозитории
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rate.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Автообновление курса"
          git push
