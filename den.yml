name: BITAMD Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        run: sudo apt-get install -y python3 python3-requests
      - name: Run update
        run: |
          python3 -c "
import json, random, time, requests

# Current rate
try:
    with open('rate.json', 'r') as f:
        old = json.load(f).get('rate', 5.00)
except:
    old = 5.00

# New rate
new = round(old * (1 + random.uniform(-0.10, 0.10)), 2)
if new < 0.50: new = 0.50

# Save locally
with open('rate.json', 'w') as f:
    json.dump({'rate': new, 'last_updated': int(time.time())}, f)

print(f'Rate: {old} -> {new}')

# Send to Google Sheet
url = 'https://script.google.com/macros/s/AKfycbx4zknAhUSNj9TbueuLPcwyx_z1S5slY7ULG9clvcGURITbrJYwDB2PykIbXKbssNtm/exec'
r = requests.get(url, params={'action':'addRateHistory','rate':new})
print('Google answer:', r.text)
"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rate.json
          git commit -m "auto update" || echo "no changes"
          git push
