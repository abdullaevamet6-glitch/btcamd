name: BITAMD Advanced

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install bc
        run: sudo apt-get update && sudo apt-get install -y bc

      - name: Update rate
        run: |
          # Читаем старый курс и историю (если есть)
          if [ -f rate.json ]; then
            OLD=$(grep -o '"rate":[0-9.]*' rate.json | head -1 | cut -d':' -f2)
            OLD_HISTORY=$(grep -o '"history":\[[^\]]*\]' rate.json | head -1 | sed 's/"history"://')
          else
            OLD=5.00
            OLD_HISTORY="[]"
          fi

          # Генерируем новый курс
          R=$((RANDOM % 100))
          if [ $R -lt 70 ]; then
            TREND=$OLD_TREND
          else
            TREND=$((RANDOM % 21 - 10))
          fi

          NEW=$(echo "$OLD + $OLD * $TREND / 100" | bc -l)

          EVENT=$((RANDOM % 200))
          if [ $EVENT -eq 0 ]; then
            NEW=$(echo "$NEW * 2" | bc -l)
          elif [ $EVENT -eq 1 ]; then
            NEW=$(echo "$NEW * 1.5" | bc -l)
          elif [ $EVENT -eq 2 ]; then
            NEW=$(echo "$NEW * 0.67" | bc -l)
          fi

          NEW=$(printf "%.2f" $NEW)
          if (( $(echo "$NEW < 0.30" | bc -l) )); then
            NEW="0.30"
          fi

          TS=$(date +%s)

          # Формируем новую историю (добавляем новый курс в конец)
          if [ "$OLD_HISTORY" = "[]" ]; then
            NEW_HISTORY="[$NEW]"
          else
            # Убираем квадратные скобки, добавляем новый курс, обрезаем до 30
            NEW_HISTORY=$(echo "$OLD_HISTORY" | sed 's/[][]//g' | tr ',' '\n' | tail -29 | tr '\n' ',' | sed 's/,$//')
            NEW_HISTORY="[$NEW_HISTORY,$NEW]"
          fi

          # Записываем новый rate.json
          cat > rate.json <<EOF
{
  "rate": $NEW,
  "trend": $TREND,
  "last_updated": $TS,
  "history": $NEW_HISTORY
}
EOF

          echo "Курс обновлен: $OLD -> $NEW"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config.user.email "github-actions[bot]@users.noreply.github.com"
          git add rate.json
          git commit -m "auto update" || echo "no changes"
          git push
