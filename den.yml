name: Update BITAMD Rate

on:
  schedule:
    - cron: '0 * * * *'  # каждый час
  workflow_dispatch:      # можно запустить вручную

jobs:
  update-rate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate new rate
        id: rate
        run: |
          python -c "
          import json, random
          try:
              with open('rate.json', 'r') as f:
                  data = json.load(f)
          except:
              data = {'rate': 5.00, 'last_updated': 0, 'history': []}
          
          old_rate = data['rate']
          # Изменение от -5% до +5%
          change = random.uniform(-0.05, 0.05)
          new_rate = round(old_rate * (1 + change), 2)
          
          data['rate'] = new_rate
          data['last_updated'] = int(__import__('time').time())
          data['history'].append(new_rate)
          if len(data['history']) > 50:
              data['history'] = data['history'][-50:]
          
          with open('rate.json', 'w') as f:
              json.dump(data, f, indent=2)
          
          # Сохраняем в переменные для следующего шага
          with open('rate.json', 'r') as f:
              print(f'RATE={new_rate}')
          " | grep "RATE=" >> $GITHUB_OUTPUT

      - name: Send rate to Google Sheets
        run: |
          RATE=${{ steps.rate.outputs.RATE }}
          CHANGE="+0%"
          curl -L "https://script.google.com/macros/s/AKfycbxVP-lihdiNZTN0UpjZn0GfoJlpXbgWF1n8vL82Cxl0azdAMfLR8PhfUePwxR9dfqCh/exec?action=addRateHistory&rate=${RATE}&change=${CHANGE}"

      - name: Commit and push updated rate.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rate.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Автообновление курса BITAMD"
          git push
