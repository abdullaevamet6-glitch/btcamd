name: BITAMD Advanced

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install jq and bc
        run: sudo apt-get update && sudo apt-get install -y jq bc

      - name: Update rate
        run: |
          if [ -f rate.json ]; then
            OLD=$(cat rate.json | jq -r '.rate')
            OLD_TREND=$(cat rate.json | jq -r '.trend // 0')
            OLD_HISTORY=$(cat rate.json | jq -r '.history // []')
          else
            OLD=5.00
            OLD_TREND=0
            OLD_HISTORY="[]"
          fi

          R=$((RANDOM % 100))
          if [ $R -lt 70 ]; then
            TREND=$OLD_TREND
          else
            TREND=$((RANDOM % 21 - 10))
          fi

          NEW=$(echo "$OLD + $OLD * $TREND / 100" | bc -l)

          EVENT=$((RANDOM % 200))
          if [ $EVENT -eq 0 ]; then
            NEW=$(echo "$NEW * 2" | bc -l)
          elif [ $EVENT -eq 1 ]; then
            NEW=$(echo "$NEW * 1.5" | bc -l)
          elif [ $EVENT -eq 2 ]; then
            NEW=$(echo "$NEW * 0.67" | bc -l)
          fi

          NEW=$(printf "%.2f" $NEW)
          if (( $(echo "$NEW < 0.30" | bc -l) )); then
            NEW="0.30"
          fi

          TS=$(date +%s)
          NEW_HISTORY=$(echo "$OLD_HISTORY" | jq --argjson new "$NEW" '. + [$new] | last(30)')

          echo "{\"rate\": $NEW, \"trend\": $TREND, \"last_updated\": $TS, \"history\": $NEW_HISTORY}" > rate.json

          echo "Курс обновлен: $OLD -> $NEW (тренд: $TREND)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rate.json
          git commit -m "auto update" || echo "no changes"
          git push
