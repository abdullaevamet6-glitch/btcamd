name: Update BITAMD Rate

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-rate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate new rate
        id: rate
        run: |
          # Читаем старый курс
          if [ -f rate.json ]; then
            OLD_RATE=$(jq -r '.rate' rate.json)
          else
            OLD_RATE=7.55
          fi
          
          # Генерируем новый курс (от -5% до +5%)
          NEW_RATE=$(python3 -c "import random; print(round($OLD_RATE * (1 + random.uniform(-0.05, 0.05)), 2))")
          
          # Если новый курс равен старому — прибавляем 0.1
          if [ "$NEW_RATE" = "$OLD_RATE" ]; then
            NEW_RATE=$(python3 -c "print(round($OLD_RATE + 0.1, 2))")
          fi
          
          echo "RATE=$NEW_RATE" >> $GITHUB_OUTPUT
          echo "OLD_RATE=$OLD_RATE" >> $GITHUB_OUTPUT
          
          # Обновляем rate.json
          echo "{\"rate\": $NEW_RATE, \"last_updated\": $(date +%s), \"history\": []}" > rate.json

      - name: Send to Google Sheets
        run: |
          curl -L "https://script.google.com/macros/s/AKfycbxr2yQ8L0ReZAbPRxQ1nCeB6yyIOVyKO5NJD5E855bnFaDz-7PTvXu5ylWjr5F64ghj/exec?action=addRateHistory&rate=${{ steps.rate.outputs.RATE }}&change=+0%"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rate.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Автообновление: ${{ steps.rate.outputs.RATE }}"
          git push
