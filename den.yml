name: Обновление курса BITAMD (Python)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Установить Python и зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-requests
      
      - name: Обновить курс и отправить в Google Sheets
        id: rate
        run: |
          python3 << EOF
import json, random, time, requests
from datetime import datetime

# 1. Читаем старый курс
try:
    with open('rate.json', 'r') as f:
        data = json.load(f)
        old_rate = data['rate']
except:
    old_rate = 5.00

# 2. Генерируем новый курс
change_pct = random.uniform(-0.10, 0.10)
new_rate = round(old_rate * (1 + change_pct), 2)

# 3. Сохраняем rate.json
data = {
    'rate': new_rate,
    'last_updated': int(time.time()),
    'history': []
}
with open('rate.json', 'w') as f:
    json.dump(data, f, indent=2)

print(f'Курс обновлён: {old_rate} -> {new_rate}')

# 4. Отправляем в Google Sheets
url = 'https://script.google.com/macros/s/AKfycbx4zknAhUSNj9TbueuLPcwyx_z1S5slY7ULG9clvcGURITbrJYwDB2PykIbXKbssNtm/exec'
params = {
    'action': 'addRateHistory',
    'rate': new_rate
}
try:
    resp = requests.get(url, params=params, timeout=10)
    print(f'Ответ Google: {resp.text}')
    if resp.status_code == 200:
        print('✅ Таблица обновлена')
    else:
        print(f'❌ Ошибка HTTP: {resp.status_code}')
except Exception as e:
    print(f'❌ Ошибка отправки: {e}')
EOF
      
      - name: Отправить изменения в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rate.json
          git commit -m "Python-обновление курса" || echo "Нет изменений"
          git push
