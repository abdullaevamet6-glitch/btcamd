name: Update BITAMD Rate

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-rate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate new rate
        id: rate
        run: |
          # Берём случайный курс от 7.00 до 9.00
          NEW_RATE=$(python3 -c "import random; print(round(random.uniform(7.00, 9.00), 2))")
          echo "RATE=$NEW_RATE" >> $GITHUB_OUTPUT
          echo "Сгенерирован новый курс: $NEW_RATE"

      - name: Send to Google Sheets
        run: |
          curl -L "https://script.google.com/macros/s/AKfycbzBeXaj6YlHNc03DdDWMX7gaYa8G_Z36eK83T4cUMu1ORmS8sYivAT6AJnCBShdGZAC/exec?action=addRateHistory&rate=${{ steps.rate.outputs.RATE }}&change=+0%"

      - name: Save to rate.json
        run: |
          echo "{\"rate\": ${{ steps.rate.outputs.RATE }}, \"last_updated\": $(date +%s), \"history\": []}" > rate.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rate.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Автообновление курса: ${{ steps.rate.outputs.RATE }}"
          git push
