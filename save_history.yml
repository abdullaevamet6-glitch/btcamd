name: Save History

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save current rate to history
        run: |
          # Читаем текущий курс
          CURRENT=$(jq -r '.rate' rate.json)
          echo "Текущий курс: $CURRENT"

          # Читаем старую историю, если есть
          if [ -f history.json ]; then
            OLD=$(cat history.json)
          else
            OLD="[]"
          fi

          # Добавляем текущий курс
          NEW=$(echo "$OLD" | jq --argjson val "$CURRENT" '. + [$val]')
          echo "$NEW" > history.json
          echo "Добавлен курс: $CURRENT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config.user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "save history" || echo "no changes"
          git push
